<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Manual Deduction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f4f6f9;
    }
    .card {
      border-radius: 14px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.08);
    }
    .header-box {
      background: linear-gradient(135deg, #0d6efd, #0b5ed7);
      color: white;
      border-radius: 14px 14px 0 0;
      padding: 18px 22px;
    }
    .form-label {
      font-weight: 600;
    }
  </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand fw-bold">🏭 BARANI HYDRAULICS – Payroll</span>
  <a href="{{ url_for('main.master') }}" class="btn btn-sm btn-outline-light">Master</a>
</nav>

<div class="container mt-4" style="max-width: 720px;">

  <div class="card">

    <!-- HEADER -->
    <div class="header-box">
      <h5 class="mb-1">Manual Deduction Entry</h5>
      <small>
        Employee No: <b>{{ emp_no }}</b> |
        Period: <b>{{ month }}/{{ year }}</b>
      </small>
    </div>

    <!-- BODY -->
    <div class="card-body">

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert alert-success">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}

      <form method="post">

        <!-- Deduction Type -->
        <div class="mb-3">
          <label class="form-label">Deduction Type *</label>
          <select name="deduction_type" class="form-select" required>
            <option value="">-- Select --</option>
            <option value="Advance">Advance</option>
            <option value="Washing Allowance">Washing Allowance</option>
            <option value="Uniform">Uniform</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <!-- Amount -->
        <div class="mb-3">
          <label class="form-label">Amount (₹) *</label>
          <input
            type="number"
            name="amount"
            class="form-control"
            step="0.01"
            min="0"
            placeholder="Enter amount"
            required
          >
        </div>

        <!-- Month -->
        <div class="mb-3">
          <label class="form-label">Applicable Month</label>
          <input
            type="text"
            class="form-control"
            value="{{ month }}/{{ year }}"
            disabled
          >
        </div>

        <!-- Reason -->
        <div class="mb-4">
          <label class="form-label">Reason</label>
          <textarea
            name="reason"
            class="form-control"
            rows="3"
            placeholder="Optional reason / notes"
          ></textarea>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="d-flex justify-content-end gap-2">
          <a href="javascript:window.close()" class="btn btn-outline-secondary">
            Cancel
          </a>
          <button class="btn btn-primary">
            💾 Save Deduction
          </button>
        </div>

      </form>

    </div>
  </div>

</div>

</body>
</html>
