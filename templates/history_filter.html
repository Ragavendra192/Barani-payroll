<!doctype html>
<html>
<head>
  <title>Payroll History Filter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

<div class="d-flex justify-content-between mb-3">
  <h4>Payroll History – Search</h4>
  <a href="{{ url_for('main.master') }}" class="btn btn-sm btn-secondary">Master</a>
</div>

<form method="get" action="/history/search" class="card card-body mb-3">
  <div class="row g-2">
    <input class="form-control col" name="emp_no" placeholder="Emp No">
    <input class="form-control col" name="emp_name" placeholder="Name">
    <input class="form-control col" name="dept" placeholder="Department">
    <input class="form-control col" name="month" placeholder="MM">
    <input class="form-control col" name="year" placeholder="YYYY">
    <input class="form-control col" name="min_net" placeholder="Min Net">
    <input class="form-control col" name="max_net" placeholder="Max Net">
    <button class="btn btn-primary mt-2">Filter</button>
  </div>
</form>

{% if records %}
<table class="table table-bordered table-sm">
<tr>
  <th>Year</th><th>Month</th><th>Emp</th><th>Name</th>
  <th>Dept</th><th>Gross</th><th>Net</th><th>Slip</th>
</tr>
{% for r in records %}
<tr>
  <td>{{ r.Year }}</td>
  <td>{{ "%02d"|format(r.Month) }}</td>
  <td>{{ r.Emp_No }}</td>
  <td>{{ r.Emp_Name }}</td>
  <td>{{ r.Department }}</td>
  <td>{{ r.Gross_Wages }}</td>
  <td><b>{{ r.Net_Pay }}</b></td>
  <td>
    <a target="_blank"
       href="/payslip/{{ r.Year }}/{{ r.Month }}/{{ r.Emp_No }}"
       class="btn btn-sm btn-outline-primary">View</a>
  </td>
</tr>
{% endfor %}
</table>
{% else %}
<div class="alert alert-info">No records found</div>
{% endif %}

</div>
</body>
</html>
