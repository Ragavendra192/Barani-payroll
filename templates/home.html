{% extends "base.html" %}

{% block title %}Home | BHIPL Payroll System{% endblock %}

{% block content %}
<div class="d-flex flex-column justify-content-center align-items-center" style="min-height: calc(100vh - 130px);">
    <div class="row row-cols-1 row-cols-md-2 g-4 w-100 mx-auto" style="max-width: 850px;">
        
        <!-- 1. MASTER -->
        <div class="col">
            <a href="{{ url_for('main.master') }}" class="text-decoration-none">
                <div class="card-custom bg-white p-4 rounded-4 border shadow-sm nav-grid-card text-center d-flex flex-column align-items-center justify-content-center gap-3 m-0">
                    <div class="p-3 rounded-4 bg-primary bg-opacity-10 text-primary d-inline-flex align-items-center justify-content-center" style="width: 68px; height: 68px;">
                        <i class="fa-solid fa-users-gear fa-2xl"></i>
                    </div>
                    <h2 class="fw-extrabold text-dark mb-0 fs-3">Master</h2>
                    <div class="btn btn-primary btn-lg fw-bold w-100 py-2 shadow-sm d-flex align-items-center justify-content-center gap-2 fs-6">
                        <span>Open Master</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                </div>
            </a>
        </div>

        <!-- 2. ATTENDANCE -->
        <div class="col">
            <a href="{{ url_for('main.attendance') }}" class="text-decoration-none">
                <div class="card-custom bg-white p-4 rounded-4 border shadow-sm nav-grid-card text-center d-flex flex-column align-items-center justify-content-center gap-3 m-0">
                    <div class="p-3 rounded-4 bg-success bg-opacity-10 text-success d-inline-flex align-items-center justify-content-center" style="width: 68px; height: 68px;">
                        <i class="fa-solid fa-calendar-check fa-2xl"></i>
                    </div>
                    <h2 class="fw-extrabold text-dark mb-0 fs-3">Attendance</h2>
                    <div class="btn btn-success btn-lg fw-bold w-100 py-2 shadow-sm d-flex align-items-center justify-content-center gap-2 text-white fs-6">
                        <span>Open Attendance</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                </div>
            </a>
        </div>

        <!-- 3. WAGES -->
        <div class="col">
            <a href="{{ url_for('main.wages') }}" class="text-decoration-none">
                <div class="card-custom bg-white p-4 rounded-4 border shadow-sm nav-grid-card text-center d-flex flex-column align-items-center justify-content-center gap-3 m-0">
                    <div class="p-3 rounded-4 bg-info bg-opacity-10 text-info d-inline-flex align-items-center justify-content-center" style="width: 68px; height: 68px;">
                        <i class="fa-solid fa-calculator fa-2xl"></i>
                    </div>
                    <h2 class="fw-extrabold text-dark mb-0 fs-3">Wages</h2>
                    <div class="btn btn-info btn-lg text-white fw-bold w-100 py-2 shadow-sm d-flex align-items-center justify-content-center gap-2 fs-6">
                        <span>Open Wages</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                </div>
            </a>
        </div>

        <!-- 4. PAYSLIP -->
        <div class="col">
            <a href="{{ url_for('main.payslip') }}" class="text-decoration-none">
                <div class="card-custom bg-white p-4 rounded-4 border shadow-sm nav-grid-card text-center d-flex flex-column align-items-center justify-content-center gap-3 m-0">
                    <div class="p-3 rounded-4 d-inline-flex align-items-center justify-content-center" style="width: 68px; height: 68px; background-color: rgba(99, 102, 241, 0.1); color: #6366f1;">
                        <i class="fa-solid fa-file-invoice-dollar fa-2xl"></i>
                    </div>
                    <h2 class="fw-extrabold text-dark mb-0 fs-3">Payslip</h2>
                    <div class="btn btn-lg text-white fw-bold w-100 py-2 shadow-sm d-flex align-items-center justify-content-center gap-2 fs-6" style="background-color: #6366f1; border-color: #6366f1;">
                        <span>Open Payslip</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                </div>
            </a>
        </div>

    </div>
</div>
{% endblock %}
